<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Simple Table</title>
  <style>
    table {
      border: 4px double black;   /* Double border */
      border-collapse: collapse;  /* Merge borders */
      width: 50%;
      text-align: center;
    }
    th, td {
      border: 2px double gray;    /* Double border for cells */
      padding: 10px;
      color: darkblue;            /* Text color */
    }
    th {
      background-color: lightyellow;
      color: darkred;             /* Different text color for header */
    }
  </style>
</head>
<body>
  <h2 style="color:green;">Simple Table Example</h2>
  <table>
    <tr>
      <th>Name</th>
      <th>Age</th>
      <th>City</th>
    </tr>
    <tr>
      <td>Ravi</td>
      <td>21</td>
      <td>Bangalore</td>
    </tr>
    <tr>
      <td>Meera</td>
      <td>22</td>
      <td>Mysore</td>
    </tr>
    <tr>
      <td>Kiran</td>
      <td>20</td>
      <td>Hubli</td>
    </tr>
  </table>
</body>
</html>
